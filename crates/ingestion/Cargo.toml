[package]
name = "schrott-mcp-ingestion"
version = "0.1.0"
edition = "2021"

[dependencies]
schrott-mcp-store = { path = "../store" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "2"
