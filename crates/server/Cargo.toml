[package]
name = "offsite-data-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "offsite-data-server"
path = "src/main.rs"

[dependencies]
offsite-data-core = { path = "../core" }
offsite-data-store = { path = "../store" }
offsite-data-auth = { path = "../auth" }
offsite-data-ingestion = { path = "../ingestion" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
