[package]
name = "schrott-mcp-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "schrott-mcp-server"
path = "src/main.rs"

[dependencies]
schrott-mcp-core = { path = "../core" }
schrott-mcp-store = { path = "../store" }
schrott-mcp-auth = { path = "../auth" }
schrott-mcp-ingestion = { path = "../ingestion" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
thiserror = "2"
