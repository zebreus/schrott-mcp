[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/auth",
    "crates/ingestion",
    "crates/server",
]

# Keep line tables in release: negligible size cost, makes perf/flamegraph
# profiles attributable instead of a wall of unknown frames.
[profile.release]
debug = "line-tables-only"
